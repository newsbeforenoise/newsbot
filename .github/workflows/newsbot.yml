name: newsbot

on:
  schedule:
    - cron: "*/5 * * * *"    # every 5 minutes (GitHub's minimum; it may run a few minutes late)
  workflow_dispatch: {}      # lets you press "Run workflow" manually

permissions:
  contents: write            # needed to save state to the "state" branch

concurrency:
  group: newsbot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Load saved state
        run: |
          if git fetch -q --depth=1 origin state 2>/dev/null; then
            git checkout FETCH_HEAD -- state/ && echo "state loaded"
          else
            echo "no saved state yet (first run)"
          fi

      - name: Install Pillow (for Instagram/Facebook image cards)
        run: pip install --quiet pillow || echo "Pillow install failed - image cards skipped"

      - name: Install video tool (only around daily-reel time)
        run: |
          if python3 newsbot/bot.py --needs-video; then
            pip install --quiet imageio-ffmpeg || echo "video tool install failed - reel will retry"
          fi

      - name: Run bot
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          BOT_ENABLED: ${{ vars.BOT_ENABLED }}
          DRY_RUN: ${{ vars.DRY_RUN }}
        run: python3 newsbot/bot.py

      - name: Upload card previews (DRY_RUN only)
        if: ${{ vars.DRY_RUN == 'true' && (hashFiles('previews/*.jpg') != '' || hashFiles('previews/*.mp4') != '') }}
        uses: actions/upload-artifact@v5
        with:
          name: card-previews
          path: |
            previews/*.jpg
            previews/*.mp4
          retention-days: 3

      - name: Save state (one overwritten commit on the "state" branch)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -d state ] || exit 0
          tmp=$(mktemp -d)
          cp -r state "$tmp/"
          cd "$tmp"
          git init -q
          git checkout -q -b state
          git config user.name "newsbot"
          git config user.email "newsbot@users.noreply.github.com"
          git add -A
          git commit -qm "bot state"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state

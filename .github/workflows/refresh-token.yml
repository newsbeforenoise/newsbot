name: weekly-maintenance

on:
  schedule:
    - cron: "17 14 * * 1"   # every Monday
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Refresh Threads token
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 newsbot/refresh_token.py

      # GitHub turns off scheduled workflows in repos with no activity for 60 days.
      # A tiny weekly commit keeps the bot running.
      - name: Keep-alive commit
        run: |
          git config user.name "newsbot"
          git config user.email "newsbot@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%MZ" > .keepalive
          git add .keepalive
          git commit -qm "keep-alive [skip ci]"
          git push -q
